name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check app tests

      - name: Format check
        run: ruff format --check app tests

      - name: Tests
        run: pytest --cov=app --cov-report=term-missing

      - name: Compile application and engineering tools
        run: |
          python -m compileall -q app
          python -m py_compile ../evaluation/retrieval/evaluate.py ../loadtests/locustfile.py

      - name: Build backend image
        run: docker build -t cloudvault-api .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Typecheck and build
        run: npm run build

      - name: Publish tested frontend bundle
        uses: actions/upload-artifact@v4
        with:
          name: cloudvault-web-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 3

      - name: Build frontend image
        run: docker build -t cloudvault-web .


  edge-functions:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Typecheck CloudVault v2 Edge Functions
        run: |
          deno check supabase/functions/multipart-upload/index.ts
          deno check supabase/functions/object-url/index.ts
          deno check supabase/functions/purge-file/index.ts
          deno check supabase/functions/restore-version/index.ts
          deno check supabase/functions/semantic-search/index.ts
          deno check supabase/functions/grounded-answer/index.ts
          deno check supabase/functions/resolve-share-link/index.ts
